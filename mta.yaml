_schema-version: 3.3.0
ID: SAP_PACE
description: A simple CAP project.
version: 1.0.0
modules:
- name: SAP_PACE-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: SAP_PACE-auth
  - name: SAP_PACE-db
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: SAP_PACE-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: SAP_PACE-db
  parameters:
    buildpack: nodejs_buildpack
resources:
- name: SAP_PACE-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      oauth2-configuration:
        credential-types:
        - binding-secret
        - x509
      tenant-mode: dedicated
      xsappname: SAP_PACE-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: SAP_PACE-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
